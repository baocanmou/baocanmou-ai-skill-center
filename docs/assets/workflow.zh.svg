<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" role="img" aria-label="包参谋 AI 技能中心 · 工作流程">
<title>包参谋 AI 技能中心 · 工作流程</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#686860"/></marker></defs>
<rect width="1200" height="470" rx="24" fill="#faf8f3"/>
<text x="40" y="58" font-size="26" font-weight="700" fill="#111111">包参谋 AI 技能中心 · 工作流程</text>
<text x="40" y="90" font-size="15" fill="#686860">底层按「方策五环」运行：识别 → 中文化 → 评估 → 编组 → 验收；第 4 步是你在界面里的主要操作</text>
<rect x="29" y="130" width="172" height="230" rx="14" fill="#ffffff" stroke="#e4e0d5" stroke-width="1.5"/>
<text x="45" y="162" font-size="13" font-weight="600" fill="#686860">01 · 识别</text>
<text x="45" y="194" font-size="19" font-weight="700" fill="#111111">只读盘点</text>
<text x="45" y="230" font-size="14" fill="#111111">扫描中心源</text>
<text x="45" y="253" font-size="14" fill="#111111">~/.agents/skills</text>
<text x="45" y="276" font-size="14" fill="#111111">和各 AI 工具的</text>
<text x="45" y="299" font-size="14" fill="#111111">技能目录，不上传</text>
<line x1="204" y1="245.0" x2="220" y2="245.0" stroke="#686860" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="223" y="130" width="172" height="230" rx="14" fill="#ffffff" stroke="#e4e0d5" stroke-width="1.5"/>
<text x="239" y="162" font-size="13" font-weight="600" fill="#686860">02 · 中文化</text>
<text x="239" y="194" font-size="19" font-weight="700" fill="#111111">看懂技能</text>
<text x="239" y="230" font-size="14" fill="#111111">生成中文名称、</text>
<text x="239" y="253" font-size="14" fill="#111111">主要用途和特点；</text>
<text x="239" y="276" font-size="14" fill="#111111">保留英文 ID</text>
<line x1="398" y1="245.0" x2="414" y2="245.0" stroke="#686860" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="417" y="130" width="172" height="230" rx="14" fill="#ffffff" stroke="#e4e0d5" stroke-width="1.5"/>
<text x="433" y="162" font-size="13" font-weight="600" fill="#686860">03 · 评估</text>
<text x="433" y="194" font-size="19" font-weight="700" fill="#111111">方策分</text>
<text x="433" y="230" font-size="14" fill="#111111">结构、理解、</text>
<text x="433" y="253" font-size="14" fill="#111111">可移植、安全、</text>
<text x="433" y="276" font-size="14" fill="#111111">可核验五维打分，</text>
<text x="433" y="299" font-size="14" fill="#111111">附静态风险提示</text>
<line x1="592" y1="245.0" x2="608" y2="245.0" stroke="#686860" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="611" y="130" width="172" height="230" rx="14" fill="#ffd900" stroke="#111111" stroke-width="1.5"/>
<text x="627" y="162" font-size="13" font-weight="600" fill="#111111">04 · 查找</text>
<text x="627" y="194" font-size="19" font-weight="700" fill="#111111">找技能·拿示例</text>
<text x="627" y="230" font-size="14" fill="#111111">按 9 种用途或</text>
<text x="627" y="253" font-size="14" fill="#111111">搜索找到技能，</text>
<text x="627" y="276" font-size="14" fill="#111111">按「先准备」整理</text>
<text x="627" y="299" font-size="14" fill="#111111">资料，复制示例</text>
<line x1="786" y1="245.0" x2="802" y2="245.0" stroke="#686860" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="805" y="130" width="172" height="230" rx="14" fill="#ffffff" stroke="#e4e0d5" stroke-width="1.5"/>
<text x="821" y="162" font-size="13" font-weight="600" fill="#686860">05 · 编组</text>
<text x="821" y="194" font-size="19" font-weight="700" fill="#111111">连接 AI 工具</text>
<text x="821" y="230" font-size="14" fill="#111111">按需连接 Codex、</text>
<text x="821" y="253" font-size="14" fill="#111111">Claude Code 等；</text>
<text x="821" y="276" font-size="14" fill="#111111">Windows 链接失败</text>
<text x="821" y="299" font-size="14" fill="#111111">时用带标记副本</text>
<line x1="980" y1="245.0" x2="996" y2="245.0" stroke="#686860" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="999" y="130" width="172" height="230" rx="14" fill="#ffffff" stroke="#e4e0d5" stroke-width="1.5"/>
<text x="1015" y="162" font-size="13" font-weight="600" fill="#686860">06 · 验收</text>
<text x="1015" y="194" font-size="19" font-weight="700" fill="#111111">重新扫描</text>
<text x="1015" y="230" font-size="14" fill="#111111">连接或断开后</text>
<text x="1015" y="253" font-size="14" fill="#111111">重新读取真实路径，</text>
<text x="1015" y="276" font-size="14" fill="#111111">不以按钮状态</text>
<text x="1015" y="299" font-size="14" fill="#111111">代替结果</text>
<rect x="29" y="388" width="1142" height="52" rx="12" fill="#111111"/>
<text x="600.0" y="420" font-size="16" fill="#faf8f3" text-anchor="middle">把示例和资料发给 Codex 或 Claude，由 AI 执行技能 —— 技能中心只负责查找、说明和连接，不直接执行技能</text>
</svg>

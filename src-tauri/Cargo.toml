[package]
name = "baocanmou-ai-skill-center"
version = "1.3.0"
description = "包参谋原创跨 AI 技能治理中心"
authors = ["BaoCanMou (包参谋)"]
license = "MIT"
homepage = "https://www.bcmsj.com"
repository = "https://github.com/yht0912/baocanmou-ai-skill-center"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
base64 = "0.22"
dirs = "5.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"

name: Publish BaoCanMou Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            args: --bundles dmg
          - os: macos-14
            target: x86_64-apple-darwin
            args: --bundles dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run version:check
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          assetNamePattern: BaoCanMou-AI-Skill-Center_[version]_[platform]_[arch][setup][ext]
          releaseName: 包参谋 AI 技能中心 ${{ github.ref_name }}
          releaseBody: |
            包参谋原创方策五环核心，中英文双语版本。
            所有本机技能均提供中文名称、主要用途与能力特点；技能自带真实截图时在详情中补充展示。
            App 图标与左上角标志统一采用包参谋原创方策标志。
            包参谋 · www.bcmsj.com · 开源交流学习使用
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.args }}
